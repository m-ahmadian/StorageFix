name: Launch probe
on:
  push:
    branches: ["claude/launch-probe", "claude/menubar-loop-fix"]
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [HEAD]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build and sample direct edition
        run: |
          set +e
          [ "${{ matrix.ref }}" != HEAD ] && git checkout -q ${{ matrix.ref }}
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          SIGN_IDENTITY=- NOTARY_PROFILE= Scripts/package-app.sh > /tmp/build.log 2>&1 || echo "::error title=${{ matrix.ref }} build::failed"
          open dist/StorageFix.app; sleep 25
          pid=$(pgrep -x StorageFix | head -1)
          ps -o %cpu= -p "$pid" > /tmp/cpu1; sleep 5; ps -o %cpu= -p "$pid" > /tmp/cpu2
          echo "::notice title=cpu ${{ matrix.ref }}::$(cat /tmp/cpu1) then $(cat /tmp/cpu2)"
