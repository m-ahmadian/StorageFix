name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # -eo pipefail, so piping through tee cannot hide a failure

jobs:
  test:
    name: ${{ matrix.edition }} build and tests
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: direct
            flags: ""
          - edition: app-store
            flags: "-Xswiftc -DAPP_STORE"
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "::notice title=Toolchain::$(swift --version 2>&1 | head -1) on macOS $(sw_vers -productVersion)"
      - name: Build
        run: swift build ${{ matrix.flags }} --scratch-path .build-ci 2>&1 | tee build.log
      - name: Test
        env:
          STORAGEFIX_RENDER_DIRECTORY: ${{ github.workspace }}/renders
          STORAGEFIX_STORE_SCREENSHOTS: ${{ matrix.edition == 'app-store' && format('{0}/store-screenshots', github.workspace) || '' }}
        run: |
          mkdir -p renders store-screenshots
          [ -n "$STORAGEFIX_STORE_SCREENSHOTS" ] || unset STORAGEFIX_STORE_SCREENSHOTS
          swift test ${{ matrix.flags }} --scratch-path .build-ci 2>&1 | tee test.log
          echo "::notice title=${{ matrix.edition }} tests::$(grep -E 'Test run with [0-9]+ tests? (in [0-9]+ suites? )?(passed|failed)' test.log | tail -1)"
          echo "::notice title=${{ matrix.edition }} skipped::$(grep -cE 'Test .* skipped' test.log || true) skipped"
          echo "::notice title=${{ matrix.edition }} renders::$(ls renders 2>/dev/null | wc -l | tr -d ' ') PNG renders" 
      - name: Packaging verifier tests
        if: matrix.edition == 'app-store'
        run: python3 -m unittest discover -s Tests/PackagingTests -v
      - name: Summarize failures as annotations
        if: failure()
        run: |
          encode() { python3 -c 'import sys; print(sys.stdin.read()[:60000].replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          for log in build.log test.log; do
            [ -f "$log" ] || continue
            echo "::error title=$log errors::$(grep -E 'error:|✘|failed|Fatal|crash' "$log" | sort -u | head -150 | encode)"
            echo "::warning title=$log tail::$(tail -40 "$log" | encode)"
          done
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: renders-${{ matrix.edition }}
          path: |
            renders/*.png
            store-screenshots/*.png
          if-no-files-found: ignore
      - name: Publish renders to the ci-renders branch
        if: success() && github.event_name == 'push'
        run: |
          src="$GITHUB_WORKSPACE/renders"; ls "$src"/*.png >/dev/null 2>&1 || exit 0
          dest="renders/${GITHUB_REF_NAME//\//-}/${{ matrix.edition }}"
          git config user.name "storagefix-ci"; git config user.email "ci@users.noreply.github.com"
          git fetch -q origin ci-renders && git worktree add -q ../out origin/ci-renders || { git worktree add -q --detach ../out && git -C ../out checkout -q --orphan ci-renders && git -C ../out rm -rfq . ; }
          mkdir -p "../out/$dest" && rm -f "../out/$dest"/*.png && cp "$src"/*.png "../out/$dest/"
          [ -d "$GITHUB_WORKSPACE/store-screenshots" ] && cp "$GITHUB_WORKSPACE"/store-screenshots/*.png "../out/$dest/" 2>/dev/null || true
          cd ../out && git add -A && git commit -qm "Renders for ${GITHUB_SHA::7} (${{ matrix.edition }})" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin ci-renders 2>/dev/null; git push -q origin HEAD:ci-renders && break; sleep 5; done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.edition }}
          path: "*.log"
          if-no-files-found: ignore

  benchmark:
    name: Opt-in performance baselines
    # Manual run, or include [benchmark] in a pushed commit message.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark]'))
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Run generated-fixture benchmarks (release)
        env:
          STORAGEFIX_BENCHMARK: "1"
          STORAGEFIX_BENCHMARK_OUTPUT: ${{ runner.temp }}/baseline.json
          STORAGEFIX_SHAPES_OUTPUT: ${{ runner.temp }}/shapes.json
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift test -c release --scratch-path .build-bench --filter 'LocalPerformanceBaselineTests|ShapeBenchmarkTests'
      - name: Publish results as annotations
        if: always()
        run: |
          echo "::notice title=Runner::$(sysctl -n machdep.cpu.brand_string) · $(sysctl -n hw.ncpu) CPUs · $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB · macOS $(sw_vers -productVersion)"
          for f in baseline shapes; do
            p="${{ runner.temp }}/$f.json"
            [ -f "$p" ] && echo "::notice title=$f::$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))' "$p")"
          done
