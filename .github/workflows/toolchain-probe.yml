name: Toolchain probe

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/toolchain-probe.yml"]

jobs:
  bisect:
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build each commit
        run: |
          for c in 66bd7ce c6b4c9e 817832c 1865760 3d8eae6 9119948; do
            git checkout -q "$c"
            if swift build --scratch-path ".build-$c" > build.txt 2>&1; then r=success
            else
              f=$(grep -m1 -oE 'primary-file [^ ]+' build.txt | sed 's#.*/Sources/##')
              m=$(grep -m1 -E 'error:|note:' build.txt | cut -c1-160)
              r="failed in ${f:-unknown}: $m"
            fi
            echo "::notice title=$c::$r"
          done
