name: Toolchain probe

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/toolchain-probe.yml", "Sources/**"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build and list every crashing or failing file
        run: |
          if swift build -Xswiftc -continue-building-after-errors --scratch-path .build-probe > build.txt 2>&1; then
            echo "::notice title=build::success"
          else
            files=$(grep -oE 'primary-file [^ ]+' build.txt | sed 's#.*/Sources/##' | sort -u | tr '\n' ' ')
            errs=$(grep -E '^/.*error:' build.txt | sed 's#.*/Sources/##' | sort -u | head -20 | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\n","%0A"))')
            echo "::error title=crashing files::${files:-none}"
            echo "::error title=errors::${errs:-none}"
          fi
